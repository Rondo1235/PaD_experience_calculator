<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puzzle Experience Calculator</title>

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#222222">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #333;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 20px;
            margin-top: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background: #555;
            color: white;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-group label {
            margin: 0;
        }

        .radio-group input {
            width: auto;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #777;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #888;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #444;
            border-radius: 10px;
        }

        .result-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .result {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            word-break: break-word;
        }

        .easy-result {
            margin-top: 10px;
            text-align: center;
            font-size: 18px;
        }

        .info {
            margin-top: 15px;
            text-align: center;
            color: #ccc;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Puzzle Experience Calculator</h1>

        <h2>基本設定</h2>

        <label for="normalExp">
            通常経験値
        </label>

        <input
            type="number"
            id="normalExp"
            value="80000000"
            min="0"
        >

        <label for="collab">
            コラボキャラクター数（最大6体）
        </label>

        <input
            type="number"
            id="collab"
            value="0"
            min="0"
            max="6"
        >

        <label>
            経験値バッジ
        </label>

        <div class="radio-group">
            <label>
                <input
                    type="radio"
                    name="badge"
                    value="1"
                    checked
                >
                なし
            </label>

            <label>
                <input
                    type="radio"
                    name="badge"
                    value="1.1"
                >
                あり ×1.1
            </label>
        </div>

        <label>
            パズドラパス
        </label>

        <div class="radio-group">
            <label>
                <input
                    type="radio"
                    name="member"
                    value="1"
                    checked
                >
                非会員
            </label>

            <label>
                <input
                    type="radio"
                    name="member"
                    value="1.05"
                >
                会員 ×1.05
            </label>
        </div>

        <label for="dumbo">
            ダンボ数
        </label>

        <input
            type="number"
            id="dumbo"
            value="0"
            min="0"
        >

        <label for="leader">
            リーダー経験値倍率
        </label>

        <select id="leader"></select>

        <label for="friend">
            フレンド経験値倍率
        </label>

        <select id="friend"></select>

        <button onclick="calculateExp()">
            経験値を計算
        </button>

        <div class="result-box">

            <div class="result-title">
                計算結果
            </div>

            <div class="result" id="result">
                0 EXP
            </div>

            <div class="easy-result" id="easyResult">
                0
            </div>

            <div class="info">
                基礎経験値：<span id="baseExp">80,000,000</span>
            </div>

            <div class="info">
                ダンボ倍率：×<span id="dumboRate">1.00</span>
            </div>

        </div>

    </div>

    <script>

        // リーダー・フレンド倍率を作成
        function createMultiplierOptions(id) {

            const select = document.getElementById(id);

            for (let i = 10; i <= 30; i++) {

                const value = i / 10;

                const option = document.createElement("option");

                option.value = value;
                option.textContent = value.toFixed(1) + "倍";

                select.appendChild(option);
            }

        }

        createMultiplierOptions("leader");
        createMultiplierOptions("friend");


        // 経験値を「兆・億・万」に変換
        function convertToJapanese(num) {
    num = Math.floor(num);

    const trillion = Math.floor(num / 1000000000000);
    const billion = Math.floor(
        (num % 1000000000000) / 100000000
    );
    const tenThousand = Math.floor(
        (num % 100000000) / 10000
    );

    let result = "";

    if (trillion > 0) {
        result += trillion + "兆";
    }

    if (billion > 0) {
        result += billion + "億";
    }

    if (tenThousand > 0) {
        result += tenThousand + "万";
    }

    if (result === "") {
        result = "0";
    }

    return result;
}

        // 経験値計算
        function calculateExp() {

            let normalExp =
                Number(
                    document.getElementById("normalExp").value
                );

            let collab =
                Number(
                    document.getElementById("collab").value
                );

            let dumbo =
                Number(
                    document.getElementById("dumbo").value
                );

            // コラボキャラクターは最大6体
            if (collab > 6) {
                collab = 6;
                document.getElementById("collab").value = 6;
            }

            if (collab < 0) {
                collab = 0;
                document.getElementById("collab").value = 0;
            }

            if (dumbo < 0) {
                dumbo = 0;
                document.getElementById("dumbo").value = 0;
            }

            // コラボキャラクター追加分
            const collabExp =
                collab * 40000000;

            // 基礎経験値
            const baseExp =
                normalExp + collabExp;

            // 経験値バッジ
            const badge =
                Number(
                    document.querySelector(
                        'input[name="badge"]:checked'
                    ).value
                );

            // 会員
            const member =
                Number(
                    document.querySelector(
                        'input[name="member"]:checked'
                    ).value
                );

            // ダンボ倍率
            const dumboRate =
                1 + (dumbo * 0.02);

            // リーダー倍率
            const leader =
                Number(
                    document.getElementById("leader").value
                );

            // フレンド倍率
            const friend =
                Number(
                    document.getElementById("friend").value
                );

            // 最終計算
            const finalExp =
                Math.floor(
                    baseExp *
                    badge *
                    member *
                    dumboRate *
                    leader *
                    friend
                );

            // 結果表示
            document.getElementById("baseExp").textContent =
                baseExp.toLocaleString();

            document.getElementById("dumboRate").textContent =
                dumboRate.toFixed(2);

            document.getElementById("result").textContent =
                finalExp.toLocaleString() + " EXP";

            document.getElementById("easyResult").textContent =
                convertToJapanese(finalExp);
        }


        // Service Worker登録
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register("./sw.js");

            });

        }

    </script>

</body>

</html>
