<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Puzzle Experience Calculator</title>

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#222222">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #222;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: #333;
            padding: 25px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 20px;
            margin-top: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: none;
            background: #555;
            color: white;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .radio-group label {
            margin: 0;
        }

        .radio-group input {
            width: auto;
        }

        .time-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .time-group input {
            flex: 1;
        }

        .time-group span {
            white-space: nowrap;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #777;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #888;
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background: #444;
            border-radius: 10px;
        }

        .result-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .result {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            word-break: break-word;
        }

        .easy-result {
            margin-top: 10px;
            text-align: center;
            font-size: 18px;
        }

        .info {
            margin-top: 15px;
            text-align: center;
            color: #ccc;
        }

        .run-result {
            font-size: 26px;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }

        .run-easy-result {
            font-size: 18px;
            text-align: center;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Puzzle Experience Calculator</h1>

        <h2>基本設定</h2>

        <label for="normalExp">
            通常経験値
        </label>

        <input
            type="number"
            id="normalExp"
            value="80000000"
            min="0"
        >

        <label for="collab">
            コラボキャラクター数（最大6体）
        </label>

        <input
            type="number"
            id="collab"
            value="0"
            min="0"
            max="6"
        >

        <label>
            経験値バッジ
        </label>

        <div class="radio-group">
            <label>
                <input
                    type="radio"
                    name="badge"
                    value="1"
                    checked
                >
                なし
            </label>

            <label>
                <input
                    type="radio"
                    name="badge"
                    value="1.1"
                >
                あり（×1.1）
            </label>
        </div>

        <label>
            パズドラパス
        </label>

        <div class="radio-group">
            <label>
                <input
                    type="radio"
                    name="member"
                    value="1"
                    checked
                >
                非会員
            </label>

            <label>
                <input
                    type="radio"
                    name="member"
                    value="1.05"
                >
                会員（×1.05）
            </label>
        </div>

        <label for="dumbo">
            ダンボ数
        </label>

        <input
            type="number"
            id="dumbo"
            value="0"
            min="0"
        >

        <label for="leader">
            リーダー経験値倍率
        </label>

        <select id="leader"></select>

        <label for="friend">
            フレンド経験値倍率
        </label>

        <select id="friend"></select>

        <button onclick="calculateAll()">
            まとめて計算
        </button>

        <div class="result-box">

            <div class="result-title">
                1周あたりの経験値
            </div>

            <div class="result" id="result">
                0 EXP
            </div>

            <div class="easy-result" id="easyResult">
                0
            </div>

            <div class="info">
                基礎経験値：<span id="baseExp">80,000,000</span>
            </div>

            <div class="info">
                ダンボ倍率：×<span id="dumboRate">1.00</span>
            </div>

        </div>


        <!-- 時速計算 -->

        <h2>時速計算</h2>

        <label>
            1周のタイム
        </label>

        <div class="time-group">

            <input
                type="number"
                id="runMinutes"
                value="1"
                min="0"
            >

            <span>分</span>

            <input
                type="number"
                id="runSeconds"
                value="30"
                min="0"
                max="59"
            >

            <span>秒</span>

        </div>

        <div class="result-box">

            <div class="result-title">
                1時間あたりの周回数
            </div>

            <div class="run-result" id="runCount">
                0周
            </div>


        </div>

        <div class="result-box">

            <div class="result-title">
                1時間あたりの獲得経験値
            </div>

            <div class="run-result" id="hourExp">
                0 EXP
            </div>

            <div class="run-easy-result" id="hourEasyExp">
                0
            </div>

        </div>

    </div>


    <script>

        // リーダー・フレンド倍率を作成
        function createMultiplierOptions(id) {

            const select = document.getElementById(id);

            for (let i = 10; i <= 30; i++) {

                const value = i / 10;

                const option =
                    document.createElement("option");

                option.value = value;

                option.textContent =
                    value.toFixed(1) + "倍";

                select.appendChild(option);
            }
        }

        createMultiplierOptions("leader");
        createMultiplierOptions("friend");


        // 経験値を日本語表記に変換
        function convertToJapanese(num) {

            num = Math.floor(num);

            const trillion =
                Math.floor(
                    num / 1000000000000
                );

            const billion =
                Math.floor(
                    (num % 1000000000000) /
                    100000000
                );

            const tenThousand =
                Math.floor(
                    (num % 100000000) /
                    10000
                );

            // 下4桁
            const lower4 =
                num % 10000;

            let result = "";

            if (trillion > 0) {
                result += trillion + "兆";
            }

            if (billion > 0) {
                result += billion + "億";
            }

            if (tenThousand > 0) {
                result += tenThousand + "万";
            }

            // 下4桁が0ではない場合だけ表示
            if (lower4 > 0) {
                result += lower4;
            }

            if (result === "") {
                result = "0";
            }

            return result;
        }


        let currentExp = 0;


        // まとめて計算
        function calculateAll() {
            calculateExp();
            calculateRuns();
        }


        // 経験値計算
        function calculateExp() {

            let normalExp =
                Number(
                    document.getElementById("normalExp").value
                );

            let collab =
                Number(
                    document.getElementById("collab").value
                );

            let dumbo =
                Number(
                    document.getElementById("dumbo").value
                );

            // コラボキャラクター最大6体
            if (collab > 6) {

                collab = 6;

                document.getElementById("collab").value = 6;
            }

            if (collab < 0) {

                collab = 0;

                document.getElementById("collab").value = 0;
            }

            if (dumbo < 0) {

                dumbo = 0;

                document.getElementById("dumbo").value = 0;
            }


            // コラボキャラクター追加分
            const collabExp =
                collab * 40000000;


            // 基礎経験値
            const baseExp =
                normalExp + collabExp;


            // 経験値バッジ
            const badge =
                Number(
                    document.querySelector(
                        'input[name="badge"]:checked'
                    ).value
                );


            // パズドラパス
            const member =
                Number(
                    document.querySelector(
                        'input[name="member"]:checked'
                    ).value
                );


            // ダンボ倍率
            const dumboRate =
                1 + (dumbo * 0.02);


            // リーダー倍率
            const leader =
                Number(
                    document.getElementById("leader").value
                );


            // フレンド倍率
            const friend =
                Number(
                    document.getElementById("friend").value
                );


            // 最終経験値
            const finalExp =
                Math.floor(
                    baseExp *
                    badge *
                    member *
                    dumboRate *
                    leader *
                    friend
                );


            // 計算した1周経験値を保存
            currentExp = finalExp;

            // 結果表示
            document.getElementById("baseExp").textContent =
                baseExp.toLocaleString();

            document.getElementById("dumboRate").textContent =
                dumboRate.toFixed(2);

            document.getElementById("result").textContent =
                finalExp.toLocaleString() + " EXP";

            document.getElementById("easyResult").textContent =
                convertToJapanese(finalExp);


        }


        // 1時間あたりの周回数・経験値を計算
        function calculateRuns() {

            const minutes =
                Number(
                    document.getElementById("runMinutes").value
                );

            const seconds =
                Number(
                    document.getElementById("runSeconds").value
                );


            // 1周の秒数
            const totalSeconds =
                (minutes * 60) + seconds;


            // タイムが0の場合
            if (totalSeconds <= 0) {

                document.getElementById("runCount").textContent =
                    "0周";

                document.getElementById("hourExp").textContent =
                    "0 EXP";

                document.getElementById("hourEasyExp").textContent =
                    "0";

                return;
            }


            // 1時間あたりの周回数
            const runCount =
                Math.floor(
                    3600 / totalSeconds
                );


            // 現在の1周経験値
            const oneRunExp = currentExp;


            // 1時間あたりの経験値
            const hourExp =
                oneRunExp * runCount;


            // 表示
            document.getElementById("runCount").textContent =
                runCount + "周";

            document.getElementById("hourExp").textContent =
                hourExp.toLocaleString() + " EXP";

            document.getElementById("hourEasyExp").textContent =
                convertToJapanese(hourExp);
        }


        // Service Worker登録
        if ("serviceWorker" in navigator) {

            window.addEventListener("load", () => {

                navigator.serviceWorker.register("./sw.js");

            });

        }

    </script>

</body>

</html>
